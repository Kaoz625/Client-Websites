<style>
  :root{--accent:#ff6600;--accent2:#ff3366;--bg:#080808;--surface:#111;--border:#1e1e1e;--text:#fff;--muted:#666}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{padding:5rem 2rem 4rem;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(255,102,0,.15) 0%,transparent 70%);border-bottom:1px solid var(--border)}
  .logo{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
  header h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:800;letter-spacing:-2px;margin-bottom:1rem}
  header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header p{color:var(--muted);font-size:1.1rem;max-width:520px;margin:0 auto 2rem;line-height:1.6}
  .stat-row{display:flex;gap:3rem;justify-content:center;flex-wrap:wrap}
  .stat{text-align:center}
  .stat-n{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:.2rem}
  .filters{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:2.5rem 2rem 1.5rem}
  .filter-btn{padding:.5rem 1.2rem;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;transition:all .2s;font-family:inherit}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--text);background:rgba(255,102,0,.1)}
  .search-wrap{display:flex;justify-content:center;padding:0 2rem 1.5rem}
  .search-wrap input{background:#111;border:1px solid var(--border);color:var(--text);padding:.6rem 1.2rem;border-radius:99px;font-size:.9rem;width:100%;max-width:360px;font-family:inherit;outline:none}
  .search-wrap input:focus{border-color:var(--accent)}
  .search-wrap input::placeholder{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;padding:1rem 2rem 5rem;max-width:1400px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 40px rgba(255,102,0,.12)}
  .card-thumb{height:10px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .ct-blue{background:linear-gradient(90deg,#00c2ff,#7b2fff)}
  .ct-green{background:linear-gradient(90deg,#00ff88,#00c2ff)}
  .ct-pink{background:linear-gradient(90deg,#ff3366,#ff6600)}
  .ct-gold{background:linear-gradient(90deg,#ffd700,#ff8c00)}
  .ct-purple{background:linear-gradient(90deg,#9b59b6,#3498db)}
  .ct-teal{background:linear-gradient(90deg,#00b4d8,#06d6a0)}
  .ct-red{background:linear-gradient(90deg,#e63946,#f4a261)}
  .card-body{padding:1.4rem;flex:1;display:flex;flex-direction:column}
  .card-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:.5rem}
  .tag-blue{color:#00c2ff}.tag-green{color:#00ff88}.tag-pink{color:#ff3366}
  .tag-gold{color:#ffd700}.tag-purple{color:#9b59b6}.tag-teal{color:#00b4d8}.tag-red{color:#e63946}
  .card h3{font-size:1.05rem;font-weight:700;margin-bottom:.4rem}
  .card p{font-size:.85rem;color:var(--muted);line-height:1.5;flex:1;margin-bottom:1.2rem}
  .card a{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--text);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:.45rem .9rem;transition:all .2s;width:fit-content}
  .card a:hover{border-color:var(--accent);color:var(--accent)}
  .card a svg{width:12px;height:12px}
  .hidden{display:none!important}
  footer{text-align:center;padding:2rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border)}
</style>

const ARROW = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10L10 2M5 2h5v5"/></svg>`;

function renderCards(items) {
  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(p => `
    <div class="card" data-cat="${p.cat}">
      <div class="card-thumb ${p.color}"></div>
      <div class="card-body">
        <div class="card-tag ${p.tagColor}">${p.tag}</div>
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <a href="${p.url}">${p.link} ${ARROW}</a>
      </div>
    </div>`).join('');
  document.getElementById('total-count').textContent = PROJECTS.length;
}

function filter(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

}

function search() {
  currentSearch = document.getElementById('search').value.toLowerCase();
  applyFilters();
}

function applyFilters() {
  const filtered = PROJECTS.filter(p => {
    const catMatch = currentCat === 'all' || p.cat === currentCat;
    const searchMatch = !currentSearch ||
      p.name.toLowerCase().includes(currentSearch) ||
      p.desc.toLowerCase().includes(currentSearch) ||
      p.tag.toLowerCase().includes(currentSearch);
    return catMatch && searchMatch;
  });
  renderCards(filtered);
}

renderCards(PROJECTS);
</script>
</body>
